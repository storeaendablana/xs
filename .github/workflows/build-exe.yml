name: Build P2Pwire EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter soundcard numpy websockets pyinstaller
        
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconsole --onefile p2pwire_desktop_gui.py
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: p2pwire-desktop-exe
        path: dist/p2pwire_desktop_gui.exe
